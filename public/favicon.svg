<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Fallen Souls favicon - Low poly skull -->
  <rect width="32" height="32" fill="#2b2b2f"/>
  
  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6bd6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b4ad6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Skull outline low poly style -->
  <polygon points="16,4 22,8 22,16 16,20 10,16 10,8" fill="url(#grad)" stroke="#b07a2a" stroke-width="0.5"/>
  <circle cx="12" cy="12" r="2" fill="#c62828"/>
  <circle cx="20" cy="12" r="2" fill="#c62828"/>
  <polygon points="14,18 18,18 17,22 15,22" fill="#4a6bd6"/>
  
  <!-- Glow effect -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#4a6bd6" stroke-width="0.5" opacity="0.3"/>
</svg>
